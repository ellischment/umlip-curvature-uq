name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      # no pretrained models and no network: only the pipeline logic is tested
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -m "not network and not models"

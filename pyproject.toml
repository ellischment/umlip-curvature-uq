[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umlip-curvature-uq"
version = "0.1.0"
description = "Does uncertainty quantification detect systematic curvature (phonon) errors in universal ML interatomic potentials?"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vasilisa Popova" }]
dependencies = [
    "ase>=3.23",
    "phonopy>=2.20",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6",
]

[project.optional-dependencies]
models = ["mace-torch", "chgnet", "mattersim", "orb-models"]
dev = ["pytest>=7"]

[project.scripts]
umlip-curvature = "umlip_curvature_uq.run:main"

[tool.setuptools.packages.find]
include = ["umlip_curvature_uq*"]

[tool.pytest.ini_options]
markers = ["network: needs internet access", "models: needs pretrained uMLIP packages"]
